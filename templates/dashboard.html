{% extends "base.html" %}

{% block body %}
<div class="dashboard">
  <aside class="sidebar">
    <h1 class="wordmark">AiGen</h1>
    <nav class="nav">
      <button class="nav-item active" data-tool="notes" type="button">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7"/><path d="M9 17h7"/></svg>
        Notes Summarizer
      </button>
      <button class="nav-item" data-tool="exam" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg>
        Exam Prep
      </button>
      <button class="nav-item" data-tool="paper" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M8 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>
        Past Paper Solver
      </button>
      <button class="nav-item" data-tool="video" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
        Video Summarizer
      </button>
      <button class="nav-item" data-tool="topic" type="button">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5V15H8v-1.5A6 6 0 0 1 12 3"/></svg>
        Topic Explainer
      </button>
    </nav>
    <div class="sidebar-footer">
      <span class="user-email">{{ email }}</span>
      <button class="btn" id="logout-button" type="button">Log out</button>
    </div>
  </aside>
  <main class="panel">
    <header class="panel-header">
      <h2 class="panel-title" id="panel-title">Notes Summarizer</h2>
      <p class="panel-description" id="panel-description">
        Upload a PDF, get a summary, then ask questions about it.
      </p>
    </header>

    <section class="tool active" id="tool-notes"></section>
    <section class="tool" id="tool-exam"></section>
    <section class="tool" id="tool-paper"></section>
    <section class="tool" id="tool-video"></section>
    <section class="tool" id="tool-topic"></section>
  </main>
</div>
{% endblock %}
