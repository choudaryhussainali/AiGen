{% extends "base.html" %}

{% block title %}Log in to AiGen{% endblock %}

{% block body %}
<main class="auth-page">
  <div class="auth-card">
    <h1 class="logo"><img src="{{ url_for('static', filename='images/AiGen_logo.png') }}" alt="AiGen"></h1>
    <p class="tagline">Five AI study tools in one calm workspace.</p>

    <h2 class="auth-heading" id="auth-heading">Log in</h2>
    <form class="auth-form" id="auth-form">
      <div class="name-fields" id="name-fields" hidden>
        <div class="name-field">
          <label class="field-label" for="first-name">First name</label>
          <input class="input" type="text" id="first-name" autocomplete="given-name" maxlength="50">
        </div>
        <div class="name-field">
          <label class="field-label" for="last-name">Last name</label>
          <input class="input" type="text" id="last-name" autocomplete="family-name" maxlength="50">
        </div>
      </div>

      <label class="field-label" for="email">Email</label>
      <input class="input" type="email" id="email" autocomplete="email" required>

      <label class="field-label" for="password">Password</label>
      <input class="input" type="password" id="password" autocomplete="current-password" required>

      <button class="btn btn-primary" type="submit" id="auth-submit">Log in</button>
    </form>

    <p class="auth-error" id="auth-error"></p>
    <p class="auth-switch">
      <span id="auth-switch-text">New to AiGen?</span>
      <a href="#" id="auth-switch-link">Create account</a>
    </p>
  </div>
</main>
{% endblock %}
